app:
  dev:
    user-id: ${DEV_USER_ID:0}
  history:
    sync:
      initial-delay-ms: 10000
      fixed-delay-ms: 10000
spring:
  application:
    name: hikari-rent-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD}
      database: 0
      connect-timeout: 5s
      timeout: 3s

mybatis-plus:
  configuration:
      # MyBatis 配置
    map-underscore-to-camel-case: true
  global-config:
      # 全局配置
    db-config:
        # 数据库配置
      id-type: auto
storage:
  public-base-url: ${R2_PUBLIC_BASE_URL:}
