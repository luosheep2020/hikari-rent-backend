app:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64}
    issuer: hikari-rent
    access-ttl: 30m
  history:
    sync:
      initial-delay-ms: 10000
      fixed-delay-ms: 10000
  elasticsearch:
    uri: ${ELASTICSEARCH_URI}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}
    sync:
      enabled: true
      initial-delay-ms: 10000
      fixed-delay-ms: 3000

spring:
  application:
    name: hikari-rent-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD:}
      database: 0
      connect-timeout: 5s
      timeout: 3s

mybatis-plus:
  configuration:
      # MyBatis 配置
    map-underscore-to-camel-case: true
  global-config:
      # 全局配置
    db-config:
        # 数据库配置
      id-type: auto
storage:
  public-base-url: ${R2_PUBLIC_BASE_URL}
  r2:
    endpoint: ${R2_ENDPOINT}
    access-key-id: ${R2_ACCESS_KEY_ID}
    secret-access-key: ${R2_SECRET_ACCESS_KEY}
    bucket: ${R2_BUCKET}
